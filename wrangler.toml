name = "wwwant"
main = "server/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# База создаётся сама при первом деплое (автосоздание ресурсов в Wrangler), ID вписывать не нужно.
[[d1_databases]]
binding = "DB"
database_name = "wwwant"

# Лимиты запросов от Cloudflare (счётчик общий для всех экземпляров Worker в одной точке).
# namespace_id: любое число, уникальное в аккаунте. period только 10 или 60.
[[ratelimits]]
name = "RL_API"      # мини-апп, на одного пользователя
namespace_id = "41001"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "RL_IP"       # любые запросы, на один IP (вебхук Telegram не считается)
namespace_id = "41002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RL_BOT"      # сообщения боту, на одного пользователя
namespace_id = "41003"
simple = { limit = 30, period = 60 }

# Раз в минуту: повторы застрявших сообщений и воскресная сводка.
[triggers]
crons = ["* * * * *"]

# Не секретное. Меняется правкой этого файла прямо на GitHub, деплой пройдёт сам.
# Токен бота здесь НЕ хранится: он задаётся секретом BOT_TOKEN в панели Cloudflare.
[vars]
OPERATOR_NAME = ""
OPERATOR_INN = ""
OPERATOR_CONTACT = ""
HOSTING_NAME = "Cloudflare, Inc."
POLICY_DRAFT = "1"
# WEBAPP_URL = "https://ваш-домен"   # нужен только если подключите свой домен; иначе берётся адрес Worker
